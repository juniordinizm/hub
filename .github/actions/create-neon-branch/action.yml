name: Create Neon branch with retries
description: Create or reuse an isolated Neon branch with bounded retries

inputs:
  api_key:
    description: Neon API key
    required: true
  branch_name:
    description: Name of the isolated branch
    required: true
  expires_at:
    description: Expiration timestamp for the isolated branch
    required: true
  project_id:
    description: Neon project ID
    required: true
  parent_branch:
    description: Parent Neon branch for the isolated database
    required: true
  api_host:
    description: Neon API host
    required: false
    default: https://console.neon.tech/api/v2

outputs:
  db_url:
    description: Direct connection URL for the isolated branch
    value: ${{ steps.attempt3.outputs.db_url || steps.attempt2.outputs.db_url || steps.attempt1.outputs.db_url }}
  db_url_pooled:
    description: Pooled connection URL for the isolated branch
    value: ${{ steps.attempt3.outputs.db_url_pooled || steps.attempt2.outputs.db_url_pooled || steps.attempt1.outputs.db_url_pooled }}
  branch_id:
    description: Neon branch ID
    value: ${{ steps.attempt3.outputs.branch_id || steps.attempt2.outputs.branch_id || steps.attempt1.outputs.branch_id }}

runs:
  using: composite
  steps:
    - name: Create Neon branch (attempt 1 of 3)
      id: attempt1
      continue-on-error: true
      uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6.3.1
      with:
        api_key: ${{ inputs.api_key }}
        api_host: ${{ inputs.api_host }}
        branch_name: ${{ inputs.branch_name }}
        expires_at: ${{ inputs.expires_at }}
        parent_branch: ${{ inputs.parent_branch }}
        project_id: ${{ inputs.project_id }}

    - name: Wait before Neon branch retry 2
      if: ${{ steps.attempt1.outcome != 'success' }}
      shell: bash
      run: sleep 5

    - name: Create Neon branch (attempt 2 of 3)
      id: attempt2
      if: ${{ steps.attempt1.outcome != 'success' }}
      continue-on-error: true
      uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6.3.1
      with:
        api_key: ${{ inputs.api_key }}
        api_host: ${{ inputs.api_host }}
        branch_name: ${{ inputs.branch_name }}
        expires_at: ${{ inputs.expires_at }}
        parent_branch: ${{ inputs.parent_branch }}
        project_id: ${{ inputs.project_id }}

    - name: Wait before Neon branch retry 3
      if: ${{ steps.attempt1.outcome != 'success' && steps.attempt2.outcome != 'success' }}
      shell: bash
      run: sleep 10

    - name: Create Neon branch (attempt 3 of 3)
      id: attempt3
      if: ${{ steps.attempt1.outcome != 'success' && steps.attempt2.outcome != 'success' }}
      continue-on-error: true
      uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6.3.1
      with:
        api_key: ${{ inputs.api_key }}
        api_host: ${{ inputs.api_host }}
        branch_name: ${{ inputs.branch_name }}
        expires_at: ${{ inputs.expires_at }}
        parent_branch: ${{ inputs.parent_branch }}
        project_id: ${{ inputs.project_id }}

    - name: Fail after Neon branch retries
      if: ${{ steps.attempt1.outcome != 'success' && steps.attempt2.outcome != 'success' && steps.attempt3.outcome != 'success' }}
      shell: bash
      run: |
        echo "Neon branch creation failed after 3 attempts."
        exit 1
