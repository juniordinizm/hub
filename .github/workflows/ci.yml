name: CI

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: CI
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hub_integration?sslmode=disable
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hub_e2e?sslmode=disable

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Run static and unit verification
        env:
          BETTER_AUTH_SECRET: ci-static-secret-not-for-deployment
          BETTER_AUTH_URL: https://ci-static.invalid
          CERTIFICATE_PUBLIC_BASE_URL: https://ci-static.invalid
          NEXT_PUBLIC_APP_URL: https://ci-static.invalid
        run: |
          set -euo pipefail
          bun run docs:check
          bun run db:migrations:check
          bun run typecheck
          bun run check
          bun run test
          bun audit --production

      - name: Create isolated PostgreSQL databases
        run: |
          set -euo pipefail
          psql "${CI_POSTGRES_ADMIN_URL}" --no-psqlrc --set=ON_ERROR_STOP=1 \
            --command="create database hub_integration"
          psql "${CI_POSTGRES_ADMIN_URL}" --no-psqlrc --set=ON_ERROR_STOP=1 \
            --command="create database hub_e2e"

      - name: Apply integration migrations
        env:
          DATABASE_URL: ${{ env.INTEGRATION_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ env.INTEGRATION_DATABASE_URL }}
        run: bun run db:migrate

      - name: Run PostgreSQL integration tests
        env:
          CERTIFICATE_CONCURRENCY_DATABASE_URL: ${{ env.INTEGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ env.INTEGRATION_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ env.INTEGRATION_DATABASE_URL }}
        run: bun run test:certificates:integration

      - name: Apply E2E migrations
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ env.E2E_DATABASE_URL }}
          E2E_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: bun run db:migrate:e2e

      - name: Run Chromium desktop and critical mobile journeys
        id: playwright
        env:
          BETTER_AUTH_SECRET: e2e-only-secret-not-for-production
          BETTER_AUTH_URL: http://127.0.0.1:3100
          CERTIFICATE_PUBLIC_BASE_URL: http://127.0.0.1:3100
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          E2E_DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
          E2E_TEST_MODE: "true"
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          bunx playwright install --with-deps chromium
          bun run test:e2e

      - name: Report E2E duration and retries
        if: always() && steps.playwright.outcome != 'skipped'
        run: bun scripts/report-playwright-metrics.ts test-results/playwright/results.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results/playwright
            test-results/next-server.log

      - name: Build with synthetic CI configuration
        env:
          BETTER_AUTH_SECRET: ci-build-placeholder-not-for-deployment
          BETTER_AUTH_URL: https://ci-build.invalid
          CERTIFICATE_PUBLIC_BASE_URL: https://ci-build.invalid
          E2E_DATABASE_URL: postgresql://verification:verification@e2e-verification.invalid/hub
          NEXT_PUBLIC_APP_URL: https://ci-build.invalid
        run: bun run build

      - name: Run Knip
        env:
          E2E_DATABASE_URL: postgresql://verification:verification@e2e-verification.invalid/hub
        run: bun run knip
