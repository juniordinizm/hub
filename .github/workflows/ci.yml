name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # docs:check validates historical commits recorded in documentation.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run docs:check
      - run: bun run db:migrations:check
      - run: bun run typecheck
      - run: bun run check
      - run: bun run test
      - run: bun audit --production

  integration-db:
    name: PostgreSQL integration
    needs: quality
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Validate isolated Neon source
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_CI_PARENT_BRANCH_ID: ${{ vars.NEON_CI_PARENT_BRANCH_ID }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in NEON_CI_PARENT_BRANCH_ID NEON_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required for isolated CI databases." >&2
              exit 1
            fi
          done
          parent_branch="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${NEON_API_KEY}" \
              --header "Accept: application/json" \
              "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${NEON_CI_PARENT_BRANCH_ID}"
          )"
          jq -e \
            --arg project "${NEON_PROJECT_ID}" \
            --arg parent "${NEON_CI_PARENT_BRANCH_ID}" \
            '.branch.project_id == $project and .branch.id == $parent and .branch.name == "vercel-preview"' \
            <<< "${parent_branch}" > /dev/null
      - name: Set branch expiry
        run: echo "NEON_EXPIRES_AT=$(date -u --date '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create isolated Neon branch
        id: neon
        uses: ./.github/actions/create-neon-branch
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-integration-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ env.NEON_EXPIRES_AT }}
          parent_branch: ${{ vars.NEON_CI_PARENT_BRANCH_ID }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
      - name: Prepare inherited migration data
        env:
          CI_NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
        run: bun run db:prepare:ci-migration
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if bun run db:migrate; then
              exit 0
            fi
            if [[ "${attempt}" == "5" ]]; then
              exit 1
            fi
            sleep "$((attempt * 3))"
          done
      - name: Run integration tests
        env:
          CERTIFICATE_CONCURRENCY_DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
        run: bun run test:certificates:integration
      - name: Delete isolated Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
          project_id: ${{ vars.NEON_PROJECT_ID }}

  e2e:
    name: Browser journeys
    # The CI Neon project has a finite branch quota. Wait for integration-db
    # to delete its branch before creating the E2E branch.
    needs: [quality, integration-db]
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Validate isolated Neon source
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_CI_PARENT_BRANCH_ID: ${{ vars.NEON_CI_PARENT_BRANCH_ID }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in NEON_CI_PARENT_BRANCH_ID NEON_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required for isolated CI databases." >&2
              exit 1
            fi
          done
          parent_branch="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${NEON_API_KEY}" \
              --header "Accept: application/json" \
              "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${NEON_CI_PARENT_BRANCH_ID}"
          )"
          jq -e \
            --arg project "${NEON_PROJECT_ID}" \
            --arg parent "${NEON_CI_PARENT_BRANCH_ID}" \
            '.branch.project_id == $project and .branch.id == $parent and .branch.name == "vercel-preview"' \
            <<< "${parent_branch}" > /dev/null
      - name: Set branch expiry
        run: echo "NEON_EXPIRES_AT=$(date -u --date '+1 day' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create isolated Neon branch
        id: neon
        uses: ./.github/actions/create-neon-branch
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: ci-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ env.NEON_EXPIRES_AT }}
          parent_branch: ${{ vars.NEON_CI_PARENT_BRANCH_ID }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
      - name: Prepare inherited migration data
        env:
          CI_NEON_BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
        run: bun run db:prepare:ci-migration
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          DATABASE_URL_DIRECT: ${{ steps.neon.outputs.db_url }}
          E2E_DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if bun run db:migrate:e2e; then
              exit 0
            fi
            if [[ "${attempt}" == "5" ]]; then
              exit 1
            fi
            sleep "$((attempt * 3))"
          done
      - name: Run Chromium journeys
        id: playwright
        env:
          BETTER_AUTH_SECRET: e2e-only-secret-not-for-production
          BETTER_AUTH_URL: http://127.0.0.1:3100
          CERTIFICATE_PUBLIC_BASE_URL: http://127.0.0.1:3100
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          E2E_DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
          E2E_TEST_MODE: "true"
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
        run: bun run test:e2e
      - name: Report E2E duration and retries
        if: always() && steps.playwright.outcome != 'skipped'
        run: bun scripts/report-playwright-metrics.ts test-results/playwright/results.json
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results/playwright
            test-results/next-server.log
      - name: Delete isolated Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          branch: ${{ steps.neon.outputs.branch_id }}
          project_id: ${{ vars.NEON_PROJECT_ID }}

  build-and-knip:
    name: Build and dependency audit
    needs: [quality, integration-db, e2e]
    if: >-
      always() && needs.quality.result == 'success' &&
      (needs.integration-db.result == 'success' || needs.integration-db.result == 'skipped') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Build with synthetic CI configuration
        env:
          BETTER_AUTH_SECRET: ci-build-placeholder-not-for-deployment
          BETTER_AUTH_URL: https://ci-build.invalid
          CERTIFICATE_PUBLIC_BASE_URL: https://ci-build.invalid
          NEXT_PUBLIC_APP_URL: https://ci-build.invalid
        run: bun run build
      - run: bun run knip
