name: Reset Staging data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan or execute
        required: true
        default: plan
        type: choice
        options: [plan, execute]
      confirm_reset:
        description: Confirm destructive reset
        required: true
        default: false
        type: boolean
      confirmation:
        description: Type RESET_STAGING_DATA for execute
        required: false
        type: string

concurrency:
  group: reset-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-24.04
    environment:
      name: vercel-staging
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: hub-development-private
      R2_OBJECT_PREFIX: staging
      R2_PUBLIC_BUCKET_NAME: hub-development-public
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
      STAGING_NEON_BRANCH_ID: ${{ vars.STAGING_NEON_BRANCH_ID }}
      STAGING_NEON_PROJECT_ID: ${{ vars.STAGING_NEON_PROJECT_ID }}
      STAGING_OPERATION_CONFIRMATION: staging
      STAGING_R2_USES_DEVELOPMENT: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: staging
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Validate reset request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CONFIRM_RESET: ${{ inputs.confirm_reset }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "${MODE}" == "execute" ]] &&
             { [[ "${CONFIRM_RESET}" != "true" ]] ||
               [[ "${CONFIRMATION}" != "RESET_STAGING_DATA" ]]; }; then
            echo "Execute reset was not explicitly confirmed." >&2
            exit 1
          fi
      - name: Set backup expiry
        if: inputs.mode == 'execute'
        run: echo "NEON_BACKUP_EXPIRES_AT=$(date -u --date '+7 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Staging backup before execute
        if: inputs.mode == 'execute'
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6.3.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: staging-reset-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ env.NEON_BACKUP_EXPIRES_AT }}
          parent: ${{ vars.STAGING_NEON_BRANCH_ID }}
          project_id: ${{ vars.STAGING_NEON_PROJECT_ID }}
      - name: Plan reset without mutation
        if: inputs.mode == 'plan'
        run: >-
          bun run db:reset:staging --
          --mode=plan --environment=staging
      - name: Execute guarded reset
        if: inputs.mode == 'execute'
        run: >-
          bun run db:reset:staging --
          --mode=execute --environment=staging
          --confirm-reset=true --confirmation=RESET_STAGING_DATA
      - name: Verify post-reset Admin invariant
        if: inputs.mode == 'execute'
        run: |
          result="$(
            psql "${DATABASE_URL_DIRECT}" --no-psqlrc --tuples-only \
              --command "select
                (select count(*) from profiles where role = 'admin'),
                (select count(*) from orders),
                (select count(*) from courses);"
          )"
          normalized="$(tr -d '[:space:]' <<< "${result}")"
          [[ "${normalized}" == "1|0|0" ]]
