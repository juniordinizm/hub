name: Migrate Neon development

on:
  workflow_dispatch:
    inputs:
      confirm_development:
        description: Confirm migration of the shared Development database
        required: true
        default: false
        type: boolean

concurrency:
  group: neon-development-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate approved main SHA to Development
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: neon-development
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: main
      - name: Verify approved main SHA and green CI
        env:
          CONFIRM_DEVELOPMENT: ${{ inputs.confirm_development }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Development migrations must be dispatched from the main branch." >&2
            exit 1
          fi

          if [[ "${CONFIRM_DEVELOPMENT}" != "true" ]]; then
            echo "Development migration was not explicitly confirmed." >&2
            exit 1
          fi

          release_sha="$(git rev-parse HEAD)"
          if [[ ! "${release_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The resolved main SHA is not a lowercase 40-character Git SHA." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ "${release_sha}" != "${main_sha}" ]]; then
            echo "The checked out SHA must equal the current origin/main SHA (${main_sha})." >&2
            exit 1
          fi

          echo "The current main SHA was validated by the Staging release flow."
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Verify Development migration configuration
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          DEVELOPMENT_DATABASE_HOST: ${{ vars.DEVELOPMENT_DATABASE_HOST }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL_DIRECT DEVELOPMENT_DATABASE_HOST; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required by the neon-development environment." >&2
              exit 1
            fi
          done
      - name: Apply Development migrations
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          DEVELOPMENT_DATABASE_HOST: ${{ vars.DEVELOPMENT_DATABASE_HOST }}
        run: bun run db:migrate:development
      - name: Audit Development migration state
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: bun run db:migrations:inspect -- --environment=neon-development
