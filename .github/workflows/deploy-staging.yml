name: Prepare Vercel staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: vercel-staging-operations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Staging migrations
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: vercel-staging
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
      STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
      STAGING_NEON_BRANCH_ID: ${{ vars.STAGING_NEON_BRANCH_ID }}
      STAGING_OPERATION_CONFIRMATION: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          ref: staging

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c624218d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Verify exact Staging target
        run: |
          set -euo pipefail
          for name in DATABASE_URL_DIRECT STAGING_DATABASE_HOST STAGING_NEON_BRANCH_ID STAGING_OPERATION_CONFIRMATION; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required by the Staging migration." >&2
              exit 1
            fi
          done
          git fetch --no-tags origin staging
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/staging)" ]]

      - name: Apply guarded Staging migrations
        run: bun run db:migrate:staging

  verify:
    name: Verify current Staging deployment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: vercel-staging
    env:
      HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
      STAGING_ORIGIN: https://preview.neurocapacitar.com.br
    steps:
      - name: Smoke Staging
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${HEALTHCHECK_SECRET}" \
            "${STAGING_ORIGIN}/api/health/ready" > /dev/null
          webhook_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${STAGING_ORIGIN}/api/webhooks/resend")"
          [[ "${webhook_status}" == "400" ]]
