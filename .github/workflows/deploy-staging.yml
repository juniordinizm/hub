name: Deploy Vercel staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: vercel-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: vercel-staging
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
      STAGING_NEON_BRANCH_ID: ${{ vars.STAGING_NEON_BRANCH_ID }}
      STAGING_NEON_PROJECT_ID: ${{ vars.STAGING_NEON_PROJECT_ID }}
      STAGING_OPERATION_CONFIRMATION: staging
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: neuro-capacitar
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify exact current Staging SHA
        id: release
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          release_sha="$(git rev-parse HEAD)"
          staging_sha="$(git rev-parse origin/staging)"
          if [[ ! "${release_sha}" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "${release_sha}" != "${CI_HEAD_SHA}" ]] ||
             [[ "${release_sha}" != "${staging_sha}" ]]; then
            echo "Deployment SHA must equal the current origin/staging SHA." >&2
            exit 1
          fi
          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Verify Staging deployment configuration
        run: |
          set -euo pipefail
          for name in DATABASE_URL_DIRECT HEALTHCHECK_SECRET NEON_API_KEY STAGING_DATABASE_HOST STAGING_NEON_BRANCH_ID STAGING_NEON_PROJECT_ID VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_SCOPE VERCEL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required by vercel-staging." >&2
              exit 1
            fi
          done
      - name: Set backup expiry
        run: echo "NEON_BACKUP_EXPIRES_AT=$(date -u --date '+7 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Staging Neon backup
        id: backup
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6.3.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: staging-release-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ env.NEON_BACKUP_EXPIRES_AT }}
          parent_branch: ${{ vars.STAGING_NEON_BRANCH_ID }}
          project_id: ${{ vars.STAGING_NEON_PROJECT_ID }}
      - name: Verify Staging Neon backup ancestry
        env:
          BACKUP_BRANCH_ID: ${{ steps.backup.outputs.branch_id }}
        run: |
          set -euo pipefail
          actual_parent="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${NEON_API_KEY}" \
              --header "Accept: application/json" \
              "https://console.neon.tech/api/v2/projects/${STAGING_NEON_PROJECT_ID}/branches/${BACKUP_BRANCH_ID}" \
              | jq -er '.branch.parent_id'
          )"
          [[ "${actual_parent}" == "${STAGING_NEON_BRANCH_ID}" ]] || {
            echo "Staging backup does not descend from the configured Staging branch." >&2
            exit 1
          }
      - name: Apply guarded Staging migrations
        run: bun run db:migrate:staging
      - name: Deploy exact SHA to the Staging target
        env:
          DEPLOYMENT_GIT_SHA: ${{ steps.release.outputs.sha }}
        run: |
          bunx vercel@57.0.0 --scope="$VERCEL_SCOPE" deploy --yes \
            --target=staging \
            --meta "githubCommitRef=staging" \
            --meta "githubCommitSha=${DEPLOYMENT_GIT_SHA}" \
            --token="$VERCEL_TOKEN"
      - name: Smoke stable Staging domain
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl --fail --silent --show-error --dump-header "${headers}" \
            "https://preview.neurocapacitar.com.br/" > /dev/null
          grep -iq '^x-robots-tag:.*noindex' "${headers}"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://preview.neurocapacitar.com.br/sitemap.xml")"
          [[ "${status}" == "404" ]]
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${HEALTHCHECK_SECRET}" \
            "https://preview.neurocapacitar.com.br/api/health/ready" > /dev/null
