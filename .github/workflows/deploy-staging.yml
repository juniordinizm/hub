name: Deploy Vercel staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: vercel-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'staging')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: vercel-staging
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
      STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
      STAGING_NEON_BRANCH_ID: ${{ vars.STAGING_NEON_BRANCH_ID }}
      STAGING_OPERATION_CONFIRMATION: staging
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: neuro-capacitar
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || 'staging' }}
      - name: Verify exact current Staging SHA
        id: release
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          release_sha="$(git rev-parse HEAD)"
          staging_sha="$(git rev-parse origin/staging)"
          if [[ ! "${release_sha}" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "${release_sha}" != "${staging_sha}" ]] ||
             [[ -n "${CI_HEAD_SHA}" && "${release_sha}" != "${CI_HEAD_SHA}" ]]; then
            echo "Deployment SHA must equal the current origin/staging SHA." >&2
            exit 1
          fi
          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Verify Staging workflow configuration
        run: |
          set -euo pipefail
          for name in DATABASE_URL_DIRECT HEALTHCHECK_SECRET STAGING_DATABASE_HOST STAGING_NEON_BRANCH_ID VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_SCOPE VERCEL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required by vercel-staging." >&2
              exit 1
            fi
          done
      - name: Apply guarded Staging migrations
        run: bun run db:migrate:staging
      - name: Deploy exact SHA to the Staging target
        id: deployment
        env:
          DEPLOYMENT_GIT_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          deployment_url="$(
            bunx vercel@57.0.0 --scope="$VERCEL_SCOPE" deploy --yes \
              --target=staging \
              --meta "githubCommitRef=staging" \
              --meta "githubCommitSha=${DEPLOYMENT_GIT_SHA}" \
              --token="$VERCEL_TOKEN" \
              --no-color
          )"
          if [[ ! "${deployment_url}" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo "Vercel did not return a valid deployment URL." >&2
            exit 1
          fi
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
      - name: Smoke exact deployment and stable Staging domain
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          set -euo pipefail

          smoke_origin() {
            local origin="$1"
            local headers
            local sitemap_status
            local webhook_status
            headers="$(mktemp)"

            if ! curl --fail --silent --show-error --dump-header "${headers}" \
              "${origin}/" > /dev/null; then
              rm -f "${headers}"
              return 1
            fi
            if ! grep -iq '^x-robots-tag:.*noindex' "${headers}"; then
              rm -f "${headers}"
              return 1
            fi
            sitemap_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "${origin}/sitemap.xml")"
            if [[ "${sitemap_status}" != "404" ]]; then
              rm -f "${headers}"
              return 1
            fi
            if ! curl --fail --silent --show-error \
              --header "Authorization: Bearer ${HEALTHCHECK_SECRET}" \
              "${origin}/api/health/ready" > /dev/null; then
              rm -f "${headers}"
              return 1
            fi
            webhook_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "${origin}/api/webhooks/resend")"
            rm -f "${headers}"
            [[ "${webhook_status}" == "400" ]]
          }

          smoke_origin "${DEPLOYMENT_URL}"

          deployment_json="$(
            bunx vercel@57.0.0 inspect "${DEPLOYMENT_URL}" \
              --scope="$VERCEL_SCOPE" \
              --token="$VERCEL_TOKEN" \
              --format=json \
              --no-color 2>/dev/null
          )"
          jq -e \
            --arg alias "preview.neurocapacitar.com.br" \
            '.target == "staging" and .readyState == "READY" and (.aliases | index($alias) != null)' \
            <<< "${deployment_json}" > /dev/null

          stable_origin="https://preview.neurocapacitar.com.br"
          for attempt in $(seq 1 12); do
            if smoke_origin "${stable_origin}"; then
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then
              sleep 5
            fi
          done
          echo "Stable Staging smoke did not converge to a healthy deployment." >&2
          exit 1
