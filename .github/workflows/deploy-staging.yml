name: Deploy Vercel staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: vercel-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: vercel-staging
    env:
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
      STAGING_NEON_BRANCH_ID: ${{ vars.STAGING_NEON_BRANCH_ID }}
      STAGING_NEON_PROJECT_ID: ${{ vars.STAGING_NEON_PROJECT_ID }}
      STAGING_OPERATION_CONFIRMATION: staging
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: neuro-capacitar
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || 'staging' }}
      - name: Verify exact current Staging SHA
        id: release
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          release_sha="$(git rev-parse HEAD)"
          staging_sha="$(git rev-parse origin/staging)"
          if [[ ! "${release_sha}" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "${release_sha}" != "${staging_sha}" ]] ||
             [[ -n "${CI_HEAD_SHA}" && "${release_sha}" != "${CI_HEAD_SHA}" ]]; then
            echo "Deployment SHA must equal the current origin/staging SHA." >&2
            exit 1
          fi
          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Verify Staging deployment configuration
        run: |
          set -euo pipefail
          for name in DATABASE_URL_DIRECT HEALTHCHECK_SECRET NEON_API_KEY STAGING_DATABASE_HOST STAGING_NEON_BRANCH_ID STAGING_NEON_PROJECT_ID VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_SCOPE VERCEL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required by vercel-staging." >&2
              exit 1
            fi
          done
      - name: Set backup expiry
        run: echo "NEON_BACKUP_EXPIRES_AT=$(date -u --date '+7 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Staging Neon backup without compute
        id: backup
        env:
          BACKUP_BRANCH_NAME: staging-release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          payload="$(
            jq -cn \
              --arg branch_name "${BACKUP_BRANCH_NAME}" \
              --arg parent_branch "${STAGING_NEON_BRANCH_ID}" \
              --arg expires_at "${NEON_BACKUP_EXPIRES_AT}" \
              '{branch:{name:$branch_name,parent_id:$parent_branch,expires_at:$expires_at},endpoints:[]}'
          )"
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          http_status="$(
            curl --silent --show-error \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${NEON_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "https://console.neon.tech/api/v2/projects/${STAGING_NEON_PROJECT_ID}/branches"
          )"
          if [[ "${http_status}" != 2* ]]; then
            echo "Neon branch backup request failed with HTTP ${http_status}." >&2
            jq -c . "${response_file}" >&2 || cat "${response_file}" >&2
            exit 1
          fi
          response="$(
            cat "${response_file}"
          )"
          branch_id="$(jq -er '.branch.id' <<< "${response}")"
          echo "branch_id=${branch_id}" >> "${GITHUB_OUTPUT}"
      - name: Verify Staging Neon backup ancestry
        env:
          BACKUP_BRANCH_ID: ${{ steps.backup.outputs.branch_id }}
        run: |
          set -euo pipefail
          actual_parent="$(
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${NEON_API_KEY}" \
              --header "Accept: application/json" \
              "https://console.neon.tech/api/v2/projects/${STAGING_NEON_PROJECT_ID}/branches/${BACKUP_BRANCH_ID}" \
              | jq -er '.branch.parent_id'
          )"
          [[ "${actual_parent}" == "${STAGING_NEON_BRANCH_ID}" ]] || {
            echo "Staging backup does not descend from the configured Staging branch." >&2
            exit 1
          }
      - name: Apply guarded Staging migrations
        run: bun run db:migrate:staging
      - name: Deploy exact SHA to the Staging target
        env:
          DEPLOYMENT_GIT_SHA: ${{ steps.release.outputs.sha }}
        run: |
          bunx vercel@57.0.0 --scope="$VERCEL_SCOPE" deploy --yes \
            --target=staging \
            --meta "githubCommitRef=staging" \
            --meta "githubCommitSha=${DEPLOYMENT_GIT_SHA}" \
            --token="$VERCEL_TOKEN"
      - name: Smoke stable Staging domain
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          curl --fail --silent --show-error --dump-header "${headers}" \
            "https://preview.neurocapacitar.com.br/" > /dev/null
          grep -iq '^x-robots-tag:.*noindex' "${headers}"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://preview.neurocapacitar.com.br/sitemap.xml")"
          [[ "${status}" == "404" ]]
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${HEALTHCHECK_SECRET}" \
            "https://preview.neurocapacitar.com.br/api/health/ready" > /dev/null
