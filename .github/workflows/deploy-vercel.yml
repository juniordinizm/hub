name: Deploy Vercel production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character SHA from main
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_PRODUCTION_MAINTENANCE
        required: true
        type: string
      confirm_production:
        description: Confirm migration and deployment to Production
        required: true
        default: false
        type: boolean

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: Migrate and deploy approved main SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: vercel-production
    env:
      DEPLOYMENT_GIT_REF: main
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: neuro-capacitar
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}
      - name: Verify approved main SHA and green CI
        id: release
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail

          if [[ "${CONFIRM_PRODUCTION}" != "true" ]] ||
             [[ "${CONFIRMATION}" != "DEPLOY_PRODUCTION_MAINTENANCE" ]]; then
            echo "Production deployment was not explicitly confirmed." >&2
            exit 1
          fi

          release_sha="${RELEASE_SHA}"
          if [[ ! "${release_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a lowercase 40-character Git SHA." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "${release_sha}" ]] ||
             ! git merge-base --is-ancestor "${release_sha}" origin/main; then
            echo "release_sha must be a commit contained in origin/main." >&2
            exit 1
          fi

          ci_runs="$(
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100"
          )"

          if ! jq -e --arg sha "${release_sha}" \
            '.workflow_runs | any(.head_sha == $sha and .conclusion == "success")' \
            <<< "${ci_runs}" > /dev/null; then
            echo "No successful CI run exists for the current main SHA." >&2
            exit 1
          fi

          echo "sha=${release_sha}" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Verify production deployment configuration
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PRODUCTION_NEON_BRANCH_ID: ${{ vars.PRODUCTION_NEON_BRANCH_ID }}
          PRODUCTION_NEON_PROJECT_ID: ${{ vars.PRODUCTION_NEON_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL_DIRECT HEALTHCHECK_SECRET NEON_API_KEY PRODUCTION_NEON_BRANCH_ID PRODUCTION_NEON_PROJECT_ID VERCEL_AUTOMATION_BYPASS_SECRET VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_SCOPE VERCEL_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required by the vercel-production environment." >&2
              exit 1
            fi
          done
      - name: Set Production backup expiry
        run: echo "NEON_BACKUP_EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create confirmed Production Neon backup
        id: backup
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # v6.3.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: production-release-${{ github.run_id }}-${{ github.run_attempt }}
          expires_at: ${{ env.NEON_BACKUP_EXPIRES_AT }}
          parent: ${{ vars.PRODUCTION_NEON_BRANCH_ID }}
          project_id: ${{ vars.PRODUCTION_NEON_PROJECT_ID }}
      - name: Apply production migrations
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: bun run db:migrate:production
      - name: Audit production migration state
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: bun run db:migrations:inspect -- --environment=vercel-production
      - name: Build unpromoted Production deployment
        id: deploy
        env:
          DEPLOYMENT_GIT_SHA: ${{ steps.release.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(
            bunx vercel@57.0.0 --scope="$VERCEL_SCOPE" deploy --yes --prod --skip-domain \
              --meta "githubCommitRef=${DEPLOYMENT_GIT_REF}" \
              --meta "githubCommitSha=${DEPLOYMENT_GIT_SHA}" \
              --token="$VERCEL_TOKEN"
          )"
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"
      - name: Smoke unpromoted Production readiness
        env:
          HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${HEALTHCHECK_SECRET}" \
            --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "${{ steps.deploy.outputs.url }}/api/health/ready"
      - name: Promote verified deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          bunx vercel@57.0.0 --scope="$VERCEL_SCOPE" promote
          "${{ steps.deploy.outputs.url }}"
          --yes --token="$VERCEL_TOKEN"
      - name: Smoke Production maintenance profile
        env:
          HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
          PRODUCTION_ORIGIN: https://app.neurocapacitar.com.br
        run: |
          set -euo pipefail
          for path in / /entrar /admin; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "${PRODUCTION_ORIGIN}${path}")"
            [[ "${status}" == "503" ]]
          done
          curl --fail --silent --show-error \
            "${PRODUCTION_ORIGIN}/api/health" > /dev/null
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${HEALTHCHECK_SECRET}" \
            "${PRODUCTION_ORIGIN}/api/health/ready" > /dev/null
