name: Verify Sentry Production readiness

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character SHA currently served in Production
        required: true
        type: string
      confirmation:
        description: Type EMIT_SENTRY_PRODUCTION_READINESS
        required: true
        type: string

concurrency:
  group: sentry-production-readiness
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Emit and verify Production Sentry event
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: vercel-production
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      PRODUCTION_ORIGIN: https://app.neurocapacitar.com.br
      RELEASE_SHA: ${{ inputs.release_sha }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      SENTRY_PROJECT_ID: ${{ vars.SENTRY_PROJECT_ID }}
      SENTRY_READINESS_ALERT_NAME: ${{ vars.SENTRY_READINESS_ALERT_NAME }}
      SENTRY_READINESS_AUTH_TOKEN: ${{ secrets.SENTRY_READINESS_AUTH_TOKEN }}
      SENTRY_READINESS_SECRET: ${{ secrets.SENTRY_READINESS_SECRET }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Validate confirmation and readiness configuration
        run: |
          set -euo pipefail

          if [[ "${CONFIRMATION}" != "EMIT_SENTRY_PRODUCTION_READINESS" ]]; then
            echo "Production Sentry readiness was not explicitly confirmed." >&2
            exit 1
          fi

          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a lowercase 40-character Git SHA." >&2
            exit 1
          fi

          for name in SENTRY_ORG SENTRY_PROJECT SENTRY_PROJECT_ID SENTRY_READINESS_ALERT_NAME SENTRY_READINESS_AUTH_TOKEN SENTRY_READINESS_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} is required by the vercel-production environment." >&2
              exit 1
            fi
          done
      - name: Emit controlled Production readiness event
        id: emit
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${SENTRY_READINESS_SECRET}" \
            --header "Content-Type: application/json" \
            --data '{"confirmation":"EMIT_SENTRY_READINESS_EVENT"}' \
            --output "${response_file}" \
            "${PRODUCTION_ORIGIN}/api/health/sentry"

          event_id="$(jq -er '.eventId' "${response_file}")"
          correlation_id="$(jq -er '.correlationId' "${response_file}")"
          if [[ ! "${event_id}" =~ ^[0-9a-f]{32}$ ]] ||
             [[ ! "${correlation_id}" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "Sentry readiness response did not contain valid identifiers." >&2
            exit 1
          fi

          echo "event_id=${event_id}" >> "${GITHUB_OUTPUT}"
          echo "correlation_id=${correlation_id}" >> "${GITHUB_OUTPUT}"
      - name: Verify release, privacy, source map and alert
        run: >-
          bun run ops:check:sentry-readiness --
          --event-id="${{ steps.emit.outputs.event_id }}"
          --environment=production
          --release="${RELEASE_SHA}"
