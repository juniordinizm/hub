name: Cleanup Neon release backups

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Neon release-backup environment
        required: true
        type: choice
        options:
          - staging
          - production
      mode:
        description: Cleanup mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
      confirmation:
        description: Type cleanup-release-backups only for execute mode
        required: false
        type: string

permissions:
  contents: read

jobs:
  scheduled-staging:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: vercel-staging
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_RELEASE_PARENT_BRANCH_ID: ${{ vars.STAGING_NEON_BRANCH_ID }}
      NEON_RELEASE_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Dry-run Staging release-backup cleanup
        run: bun run ops:cleanup:release-backups -- --environment=staging --dry-run

  scheduled-production:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: vercel-production
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_RELEASE_PARENT_BRANCH_ID: ${{ vars.PRODUCTION_NEON_BRANCH_ID }}
      NEON_RELEASE_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Dry-run Production release-backup cleanup
        run: bun run ops:cleanup:release-backups -- --environment=production --dry-run

  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ inputs.environment == 'staging' && 'vercel-staging' || 'vercel-production' }}
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_RELEASE_PARENT_BRANCH_ID: ${{ inputs.environment == 'staging' && vars.STAGING_NEON_BRANCH_ID || vars.PRODUCTION_NEON_BRANCH_ID }}
      NEON_RELEASE_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      RELEASE_BACKUP_CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Run approved release-backup cleanup
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          CLEANUP_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          bun run ops:cleanup:release-backups -- \
            "--environment=${TARGET_ENVIRONMENT}" \
            "--${CLEANUP_MODE}"
