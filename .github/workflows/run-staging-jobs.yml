name: Run Staging jobs

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Staging operation
        required: true
        default: run-jobs
        type: choice
        options:
          - run-jobs
          - verify-resend-lifecycle
      confirmation:
        description: Type SEND_CONTROLLED_STAGING_PASSWORD_RESET for lifecycle verification
        required: false
        type: string
concurrency:
  group: staging-jobs-manual
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: inputs.operation == 'run-jobs'
    runs-on: ubuntu-24.04
    environment:
      name: vercel-staging
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      STAGING_ORIGIN: https://preview.neurocapacitar.com.br
    steps:
      - name: Invoke authenticated Staging workers
        env:
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "CRON_SECRET is required by vercel-staging." >&2
            exit 1
          fi
          call_job() {
            local path="$1"
            curl --fail --silent --show-error \
              --output /dev/null \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "${STAGING_ORIGIN}${path}"
          }
          failed=0
          call_job "/api/cron/asaas-webhooks" || failed=1
          call_job "/api/cron/outbox" || failed=1
          call_job "/api/cron/jmvstream" || failed=1
          call_job "/api/cron/resend-webhooks" || failed=1
          call_job "/api/cron/enrollments" || failed=1
          call_job "/api/cron/maintenance" || failed=1
          exit "${failed}"

  verify-resend-lifecycle:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'verify-resend-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: vercel-staging
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      RESEND_READINESS_SECRET: ${{ secrets.RESEND_READINESS_SECRET }}
      RESEND_LIFECYCLE_CONFIRMATION: ${{ inputs.confirmation }}
      STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
      STAGING_NEON_BRANCH_ID: ${{ vars.STAGING_NEON_BRANCH_ID }}
      STAGING_OPERATION_CONFIRMATION: staging
      STAGING_ORIGIN: https://preview.neurocapacitar.com.br
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: staging
      - name: Verify exact current Staging SHA
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/staging)" ]] || {
            echo "Lifecycle verification must use the current Staging SHA." >&2
            exit 1
          }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Emit and verify one controlled lifecycle
        run: bun run ops:check:resend-lifecycle:staging -- --execute
