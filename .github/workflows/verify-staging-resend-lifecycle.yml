name: Verify Staging Resend lifecycle

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SEND_CONTROLLED_STAGING_PASSWORD_RESET
        required: true
        type: string

concurrency:
  group: staging-resend-lifecycle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: vercel-staging
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      RESEND_LIFECYCLE_CONFIRMATION: ${{ inputs.confirmation }}
      STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      STAGING_DATABASE_HOST: ${{ vars.STAGING_DATABASE_HOST }}
      STAGING_NEON_BRANCH_ID: ${{ vars.STAGING_NEON_BRANCH_ID }}
      STAGING_OPERATION_CONFIRMATION: staging
      STAGING_ORIGIN: https://preview.neurocapacitar.com.br
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: staging
      - name: Verify exact current Staging SHA
        run: |
          set -euo pipefail
          git fetch --no-tags origin staging
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/staging)" ]] || {
            echo "Lifecycle verification must use the current Staging SHA." >&2
            exit 1
          }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Emit and verify one controlled lifecycle
        run: bun run ops:check:resend-lifecycle:staging -- --execute
