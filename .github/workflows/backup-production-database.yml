name: Backup Production database

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: production-database-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Encrypt and publish PostgreSQL backup
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-backup
    env:
      BACKUP_CADENCE_HOURS: "6"
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      BACKUP_R2_ACCOUNT_ID: ${{ vars.BACKUP_R2_ACCOUNT_ID }}
      BACKUP_R2_BUCKET_NAME: ${{ vars.BACKUP_R2_BUCKET_NAME }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      PRODUCTION_NEON_BRANCH_ID: ${{ vars.PRODUCTION_NEON_BRANCH_ID }}
      PRODUCTION_NEON_PROJECT_ID: ${{ vars.PRODUCTION_NEON_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Install and verify PostgreSQL 18 client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-18
          export PATH="/usr/lib/postgresql/18/bin:${PATH}"
          pg_dump --version | grep --extended-regexp 'PostgreSQL\) 18([.]|$)'
          pg_restore --version | grep --extended-regexp 'PostgreSQL\) 18([.]|$)'
      - name: Install and verify age 1.3.1
        env:
          AGE_ARCHIVE_SHA256: bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377
          AGE_VERSION: 1.3.1
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/age-v1.3.1-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --proto-redir '=https' \
            "https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz" \
            --output "${archive}"
          echo "${AGE_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}"
          sudo install --mode 0755 "${RUNNER_TEMP}/age/age" /usr/local/bin/age
          age --version | grep --extended-regexp '^v?1[.]3[.]1$'
      - name: Create encrypted Production backup
        id: backup
        run: |
          set -euo pipefail
          result="$(bun run ops:backup:production | tail --lines=1)"
          jq --exit-status '.status == "completed"' <<< "${result}" > /dev/null
          echo "result=${result}" >> "${GITHUB_OUTPUT}"
      - name: Write sanitized backup summary
        env:
          BACKUP_RESULT: ${{ steps.backup.outputs.result }}
        run: |
          set -euo pipefail
          {
            echo "### Production database backup"
            jq --raw-output '
              "- status: \(.status)\n" +
              "- backup ID: \(.backupId)\n" +
              "- created: \(.createdAt)\n" +
              "- bytes: \(.bytes)\n" +
              "- classes: \(.classes | join(", "))\n" +
              "- migration: \(.migration)"
            ' <<< "${BACKUP_RESULT}"
          } >> "${GITHUB_STEP_SUMMARY}"
